# Publish to npm when a GitHub release is published.
#
# Uses npm trusted publishing: GitHub mints a short-lived OIDC token for this
# workflow run and npm accepts it in place of credentials. There is no token to
# store in the repository and none to rotate.
#
# This only works once the package's trusted publisher is configured on
# npmjs.com — see CONTRIBUTING.md. Until then the workflow fails loudly rather
# than publishing by some other means.

name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, e.g. v0.1.0
        required: true

permissions:
  contents: read
  # Required for trusted publishing: lets the job request an OIDC token
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      # A mistagged release would otherwise publish the wrong version under the
      # right name, which cannot be undone
      - name: Check the tag matches package.json
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          VERSION="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json $VERSION"
            exit 1
          fi

      # prepublishOnly builds and runs the tests, so a release that would not
      # build never reaches the registry
      - name: Publish
        run: npm publish
